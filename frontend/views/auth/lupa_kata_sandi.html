<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/styles/global.css" />
    <link rel="stylesheet" href="/styles/auth/lupa_kata_sandi.css" />
    <script src="/scripts/global.js" defer></script>
    <script src="/scripts/auth/lupa_kata_sandi.js" defer></script>
    <title>LAPAK — Lupa Kata Sandi</title>
  </head>
  <body>
    <div class="bg">
      <div class="card">
        <!-- Brand -->
        <div class="brand">
          <span class="brand-name">LAPAK</span>
          <span class="brand-sub">Business Management</span>
        </div>

        <!-- Lapak Logo -->
        <div class="logo">
          <img src="/assets/images/lapak.png" width="55" alt="Lapak Logo" />
        </div>

        <!-- Heading -->
        <h1 class="card-title">Lupa Kata Sandi</h1>
        <p class="card-subtitle">
          Masukkan email akun Anda untuk menerima tautan perubahan kata sandi.
        </p>

        <!-- Alert error -->
        <div class="alert-error" id="alert-error" style="display: none"></div>

        <!-- Form -->
        <form class="form" id="form-lupa-password" novalidate>
          <div class="field">
            <label class="label" for="email">Email</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="2" y="4" width="20" height="16" rx="2" />
                  <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
                </svg>
              </span>
              <input
                class="input input--padded"
                id="email"
                name="email"
                type="email"
                placeholder="Masukkan email terdaftar"
                autocomplete="email"
                required
              />
            </div>
            <span class="field-error" id="error-email"></span>
          </div>

          <button class="btn-primary" type="submit" id="kirim-btn">
            <span id="btn-text">Kirim Link Perubahan</span>
            <div id="btn-loader" style="display: none">
              <svg
                width="18"
                height="18"
                viewBox="0 0 18 18"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                class="spin"
              >
                <path
                  d="M9 1V4M9 14V17M1 9H4M14 9H17M3.05 3.05L5.17 5.17M12.83 12.83L14.95 14.95M3.05 14.95L5.17 12.83M12.83 5.17L14.95 3.05"
                  stroke="white"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
              <span style="margin-top: 2px">Mengirim...</span>
            </div>
          </button>

          <div class="back-link">
            <a href="/masuk" class="back-link-anchor">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M19 12H5" />
                <path d="m12 19-7-7 7-7" />
              </svg>
              Kembali ke Masuk
            </a>
          </div>
        </form>
      </div>
    </div>

    <!-- ────── Success Modal — Email Berhasil Dikirim ───── -->
    <div
      class="success-modal-overlay"
      id="success-modal-overlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="success-modal-title"
    >
      <div class="success-modal-card">
        <div class="success-modal-card-brand">LAPAK</div>

        <div class="success-modal-illustration">
          <img
            src="/assets/images/success_illustration.png"
            width="120"
            alt="Success"
          />
          <span class="success-modal-card-badge">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M5 13l4 4L19 7"
                stroke="#ffffff"
                stroke-width="3"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
        </div>

        <h2 class="success-modal-card-title" id="success-modal-title">
          Email Berhasil Dikirim
        </h2>
        <p class="success-modal-card-message" id="success-modal-message">
          Kami telah mengirimkan tautan perubahan kata sandi ke email Anda.
          Silakan periksa kotak masuk atau folder spam.
        </p>
        <a class="success-modal-card-btn" href="/masuk" id="success-modal-btn">
          Kembali ke Login
        </a>
      </div>
    </div>
  </body>
</html>
