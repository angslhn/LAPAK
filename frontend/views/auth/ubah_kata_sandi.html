<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/styles/global.css" />
    <link rel="stylesheet" href="/styles/auth/ubah_kata_sandi.css" />
    <script src="/scripts/auth/ubah_kata_sandi.js" defer></script>
    <title>LAPAK — Ubah Kata Sandi</title>
  </head>
  <body>
    <div class="bg">
      <div class="card">
        <!-- Brand -->
        <div class="brand">
          <span class="brand__name">LAPAK</span>
          <span class="brand__sub">Business Management</span>
        </div>

        <!-- Lapak Logo -->
        <div class="logo">
          <img src="/assets/images/lapak.png" width="65" alt="Lapak Logo" />
        </div>

        <!-- Heading -->
        <h1 class="card__title">Buat Kata Sandi Baru</h1>
        <p class="card__subtitle">Masukkan kata sandi baru untuk akun Anda.</p>

        <!-- Alert error -->
        <div class="alert-error" id="alert-error" style="display: none"></div>

        <!-- Alert success -->
        <div class="alert-success" id="alert-success" style="display: none">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
            <polyline points="22 4 12 14.01 9 11.01" />
          </svg>
          <span id="success-message">Kata sandi berhasil diperbarui!</span>
        </div>

        <!-- Form -->
        <form class="form" id="form-ubah-password" novalidate>
          <div class="field">
            <label class="label" for="password">Kata Sandi Baru</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="14"
                  height="18"
                  viewBox="0 0 14 18"
                  fill="none"
                >
                  <path
                    d="M7 13C7.55 13 8.02083 12.8042 8.4125 12.4125C8.80417 12.0208 9 11.55 9 11C9 10.45 8.80417 9.97917 8.4125 9.5875C8.02083 9.19583 7.55 9 7 9C6.45 9 5.97917 9.19583 5.5875 9.5875C5.19583 9.97917 5 10.45 5 11C5 11.55 5.19583 12.0208 5.5875 12.4125C5.97917 12.8042 6.45 13 7 13ZM2 18C1.45 18 0.979167 17.8042 0.5875 17.4125C0.195833 17.0208 0 16.55 0 16V6C0 5.45 0.195833 4.97917 0.5875 4.5875C0.979167 4.19583 1.45 4 2 4H3V2C3 1.45 3.19583 0.979167 3.5875 0.5875C3.97917 0.195833 4.45 0 5 0H9C9.55 0 10.0208 0.195833 10.4125 0.5875C10.8042 0.979167 11 1.45 11 2V4H12C12.55 4 13.0208 4.19583 13.4125 4.5875C13.8042 4.97917 14 5.45 14 6V16C14 16.55 13.8042 17.0208 13.4125 17.4125C13.0208 17.8042 12.55 18 12 18H2ZM5 4H9V2H5V4ZM2 16H12V6H2V16Z"
                    fill="#9AA0A6"
                  />
                </svg>
              </span>
              <input
                class="input input--padded input--icon-right"
                id="password"
                name="password"
                type="password"
                placeholder="Minimal 8 karakter"
                required
              />
              <button
                class="eye-btn"
                type="button"
                aria-label="Toggle password"
                data-target="password"
              >
                <svg
                  class="eye-icon eye-show"
                  width="20"
                  height="16"
                  viewBox="0 0 576 512"
                  fill="#9AA0A6"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M288 32c-80.8 0-145.5 36.8-192.6 80.6C48.6 156 17.3 208 2.5 243.7c-3.3 7.9-3.3 16.7 0 24.6C17.3 304 48.6 356 95.4 399.4C142.5 443.2 207.2 480 288 480s145.5-36.8 192.6-80.6c46.8-43.4 78.1-95.4 92.9-131.1c3.3-7.9 3.3-16.7 0-24.6c-14.8-35.7-46.1-87.7-92.9-131.1C433.5 68.8 368.8 32 288 32zM128 256a160 160 0 1 1 320 0 160 160 0 1 1 -320 0zm160-80a80 80 0 1 0 0 160 80 80 0 1 0 0-160z"
                  />
                </svg>
                <svg
                  class="eye-icon eye-hide"
                  width="20"
                  height="16"
                  viewBox="0 0 640 512"
                  fill="#9AA0A6"
                  xmlns="http://www.w3.org/2000/svg"
                  style="display: none"
                >
                  <path
                    d="M38.8 5.1C28.4-3.1 13.3-1.2 5.1 9.2S-1.2 34.7 9.2 42.9l592 464c10.4 8.2 25.5 6.3 33.7-4.1s6.3-25.5-4.1-33.7L525.6 386.7c39.6-40.6 66.4-86.1 79.9-118.4c3.3-7.9 3.3-16.7 0-24.6c-14.8-35.7-46.1-87.7-92.9-131.1C465.5 68.8 400.8 32 320 32c-68.2 0-125 26.3-169.3 60.8L38.8 5.1zM223.1 149.5C248.6 126.2 282.7 112 320 112c79.5 0 144 64.5 144 144c0 24.9-6.3 48.3-17.4 68.7L408 294.5c8.4-19.3 10.6-41.4 4.8-63.3c-11.1-41.5-47.8-69.4-88.6-71.1c-5.8-.2-9.2 6.1-7.4 11.7c2.1 6.4 3.3 13.2 3.3 20.3c0 10.2-2.4 19.8-6.6 28.3l-90.3-70.8zM373 389.9c-16.4 6.5-34.3 10.1-53 10.1c-79.5 0-144-64.5-144-144c0-6.9 .5-13.6 1.4-20.2L83.1 161.5C60.3 191.2 44 220.8 34.5 243.7c-3.3 7.9-3.3 16.7 0 24.6c14.8 35.7 46.1 87.7 92.9 131.1C174.5 443.2 239.2 480 320 480c47.8 0 89.9-12.9 126.2-32.5L373 389.9z"
                  />
                </svg>
              </button>
            </div>
            <span class="field-error" id="error-password"></span>
          </div>

          <div class="field">
            <label class="label" for="konfirmasi"
              >Konfirmasi Kata Sandi Baru</label
            >
            <div class="input-wrapper">
              <span class="input-icon">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="14"
                  height="18"
                  viewBox="0 0 14 18"
                  fill="none"
                >
                  <path
                    d="M7 13C7.55 13 8.02083 12.8042 8.4125 12.4125C8.80417 12.0208 9 11.55 9 11C9 10.45 8.80417 9.97917 8.4125 9.5875C8.02083 9.19583 7.55 9 7 9C6.45 9 5.97917 9.19583 5.5875 9.5875C5.19583 9.97917 5 10.45 5 11C5 11.55 5.19583 12.0208 5.5875 12.4125C5.97917 12.8042 6.45 13 7 13ZM2 18C1.45 18 0.979167 17.8042 0.5875 17.4125C0.195833 17.0208 0 16.55 0 16V6C0 5.45 0.195833 4.97917 0.5875 4.5875C0.979167 4.19583 1.45 4 2 4H3V2C3 1.45 3.19583 0.979167 3.5875 0.5875C3.97917 0.195833 4.45 0 5 0H9C9.55 0 10.0208 0.195833 10.4125 0.5875C10.8042 0.979167 11 1.45 11 2V4H12C12.55 4 13.0208 4.19583 13.4125 4.5875C13.8042 4.97917 14 5.45 14 6V16C14 16.55 13.8042 17.0208 13.4125 17.4125C13.0208 17.8042 12.55 18 12 18H2ZM5 4H9V2H5V4ZM2 16H12V6H2V16Z"
                    fill="#9AA0A6"
                  />
                </svg>
              </span>
              <input
                class="input input--padded input--icon-right"
                id="konfirmasi"
                name="confirm_password"
                type="password"
                placeholder="Ulangi kata sandi baru"
                required
              />
              <button
                class="eye-btn"
                type="button"
                aria-label="Toggle konfirmasi kata sandi"
                data-target="konfirmasi"
              >
                <svg
                  class="eye-icon eye-show"
                  width="20"
                  height="16"
                  viewBox="0 0 576 512"
                  fill="#9AA0A6"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M288 32c-80.8 0-145.5 36.8-192.6 80.6C48.6 156 17.3 208 2.5 243.7c-3.3 7.9-3.3 16.7 0 24.6C17.3 304 48.6 356 95.4 399.4C142.5 443.2 207.2 480 288 480s145.5-36.8 192.6-80.6c46.8-43.4 78.1-95.4 92.9-131.1c3.3-7.9 3.3-16.7 0-24.6c-14.8-35.7-46.1-87.7-92.9-131.1C433.5 68.8 368.8 32 288 32zM128 256a160 160 0 1 1 320 0 160 160 0 1 1 -320 0zm160-80a80 80 0 1 0 0 160 80 80 0 1 0 0-160z"
                  />
                </svg>
                <svg
                  class="eye-icon eye-hide"
                  width="20"
                  height="16"
                  viewBox="0 0 640 512"
                  fill="#9AA0A6"
                  xmlns="http://www.w3.org/2000/svg"
                  style="display: none"
                >
                  <path
                    d="M38.8 5.1C28.4-3.1 13.3-1.2 5.1 9.2S-1.2 34.7 9.2 42.9l592 464c10.4 8.2 25.5 6.3 33.7-4.1s6.3-25.5-4.1-33.7L525.6 386.7c39.6-40.6 66.4-86.1 79.9-118.4c3.3-7.9 3.3-16.7 0-24.6c-14.8-35.7-46.1-87.7-92.9-131.1C465.5 68.8 400.8 32 320 32c-68.2 0-125 26.3-169.3 60.8L38.8 5.1zM223.1 149.5C248.6 126.2 282.7 112 320 112c79.5 0 144 64.5 144 144c0 24.9-6.3 48.3-17.4 68.7L408 294.5c8.4-19.3 10.6-41.4 4.8-63.3c-11.1-41.5-47.8-69.4-88.6-71.1c-5.8-.2-9.2 6.1-7.4 11.7c2.1 6.4 3.3 13.2 3.3 20.3c0 10.2-2.4 19.8-6.6 28.3l-90.3-70.8zM373 389.9c-16.4 6.5-34.3 10.1-53 10.1c-79.5 0-144-64.5-144-144c0-6.9 .5-13.6 1.4-20.2L83.1 161.5C60.3 191.2 44 220.8 34.5 243.7c-3.3 7.9-3.3 16.7 0 24.6c14.8 35.7 46.1 87.7 92.9 131.1C174.5 443.2 239.2 480 320 480c47.8 0 89.9-12.9 126.2-32.5L373 389.9z"
                  />
                </svg>
              </button>
            </div>
            <span class="field-error" id="error-konfirmasi"></span>
          </div>

          <button class="btn-primary" type="submit" id="ubah-btn">
            <span id="btn-text">Simpan Kata Sandi Baru</span>
            <span id="btn-loader" style="display: none">
              <svg
                width="18"
                height="18"
                viewBox="0 0 18 18"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                class="spin"
              >
                <path
                  d="M9 1V4M9 14V17M1 9H4M14 9H17M3.05 3.05L5.17 5.17M12.83 12.83L14.95 14.95M3.05 14.95L5.17 12.83M12.83 5.17L14.95 3.05"
                  stroke="white"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
              Menyimpan...
            </span>
          </button>

          <div class="back-link">
            <a href="/masuk" class="back-link__anchor">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M19 12H5" />
                <path d="m12 19-7-7 7-7" />
              </svg>
              Kembali ke Masuk
            </a>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
