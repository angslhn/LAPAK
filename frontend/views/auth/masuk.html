<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LAPAK — Masuk</title>
    <meta
      name="description"
      content="Masuk ke LAPAK — Sistem manajemen toko modern untuk bisnis Anda."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0d5740" />
    <link rel="shortcut icon" href="/public/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="/styles/global.css" />
    <link rel="stylesheet" href="/styles/auth/masuk.css" />
    <script src="/scripts/global.js" defer></script>
    <script src="/scripts/auth/masuk.js" defer></script>
  </head>
  <body>
    <div class="login-shell">
      <!-- ── Kiri: Branding ── -->
      <div class="brand-panel">
        <div class="brand-content">
          <div class="brand-logo">
            <div class="brand-icon">
              <img src="/assets/images/lapak.png" width="55" alt="Lapak Logo" />
            </div>
            <div>
              <div class="brand-name">LAPAK</div>
              <div class="brand-sub">Manajemen Bisnis</div>
            </div>
          </div>
          <p class="brand-tagline">
            Kelola Penjualan, Stok, dan Keuangan Toko<br />Dalam Satu Aplikasi
          </p>
        </div>
      </div>

      <!-- ── Kanan: Form ── -->
      <div class="form-panel">
        <div class="form-wrap">
          <div class="form-header">
            <h1>Masuk ke Akun</h1>
            <p>Silakan masuk untuk mengelola bisnis Anda</p>
          </div>

          <div class="alert-error" id="alert-error" style="display: none"></div>

          <form id="form-masuk" novalidate>
            <!-- Email -->
            <div class="field-group">
              <label for="email">Email</label>
              <div class="input-wrap">
                <span class="input-ico">
                  <svg
                    width="18"
                    height="14"
                    viewBox="0 0 18 14"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <path
                      d="M1 0H17C17.55 0 18 0.45 18 1V13C18 13.55 17.55 14 17 14H1C0.45 14 0 13.55 0 13V1C0 0.45 0.45 0 1 0ZM9 8L2 3V12H16V3L9 8ZM2 1L9 6L16 1H2Z"
                      fill="#9AA0A6"
                    />
                  </svg>
                </span>
                <input
                  type="email"
                  id="email"
                  name="email"
                  class="input-field"
                  placeholder="Masukkan email Anda"
                  autocomplete="email"
                  required
                />
              </div>
              <span class="field-error" id="error-email"></span>
            </div>

            <!-- Password -->
            <div class="field-group">
              <label for="password">Kata Sandi</label>
              <div class="input-wrap">
                <span class="input-ico">
                  <svg
                    width="14"
                    height="18"
                    viewBox="0 0 14 18"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <path
                      d="M7 13C7.55 13 8.02083 12.8042 8.4125 12.4125C8.80417 12.0208 9 11.55 9 11C9 10.45 8.80417 9.97917 8.4125 9.5875C8.02083 9.19583 7.55 9 7 9C6.45 9 5.97917 9.19583 5.5875 9.5875C5.19583 9.97917 5 10.45 5 11C5 11.55 5.19583 12.0208 5.5875 12.4125C5.97917 12.8042 6.45 13 7 13ZM2 18C1.45 18 0.979167 17.8042 0.5875 17.4125C0.195833 17.0208 0 16.55 0 16V6C0 5.45 0.195833 4.97917 0.5875 4.5875C0.979167 4.19583 1.45 4 2 4H3V2C3 1.45 3.19583 0.979167 3.5875 0.5875C3.97917 0.195833 4.45 0 5 0H9C9.55 0 10.0208 0.195833 10.4125 0.5875C10.8042 0.979167 11 1.45 11 2V4H12C12.55 4 13.0208 4.19583 13.4125 4.5875C13.8042 4.97917 14 5.45 14 6V16C14 16.55 13.8042 17.0208 13.4125 17.4125C13.0208 17.8042 12.55 18 12 18H2ZM5 4H9V2H5V4ZM2 16H12V6H2V16Z"
                      fill="#9AA0A6"
                    />
                  </svg>
                </span>
                <input
                  type="password"
                  id="password"
                  name="password"
                  class="input-field"
                  placeholder="Masukkan kata sandi Anda"
                  autocomplete="current-password"
                  required
                />
                <button
                  type="button"
                  class="toggle-pw"
                  id="toggle-pw"
                  tabindex="-1"
                  aria-label="Toggle password visibility"
                >
                  <!-- Ikon mata terbuka (default) -->
                  <svg
                    id="ico-show"
                    width="20"
                    height="16"
                    viewBox="0 0 576 512"
                    fill="#9AA0A6"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <path
                      d="M288 32c-80.8 0-145.5 36.8-192.6 80.6C48.6 156 17.3 208 2.5 243.7c-3.3 7.9-3.3 16.7 0 24.6C17.3 304 48.6 356 95.4 399.4C142.5 443.2 207.2 480 288 480s145.5-36.8 192.6-80.6c46.8-43.4 78.1-95.4 92.9-131.1c3.3-7.9 3.3-16.7 0-24.6c-14.8-35.7-46.1-87.7-92.9-131.1C433.5 68.8 368.8 32 288 32zM128 256a160 160 0 1 1 320 0 160 160 0 1 1 -320 0zm160-80a80 80 0 1 0 0 160 80 80 0 1 0 0-160z"
                    />
                  </svg>
                  <!-- Ikon mata tertutup (hidden default) -->
                  <svg
                    id="ico-hide"
                    width="20"
                    height="16"
                    viewBox="0 0 640 512"
                    fill="#9AA0A6"
                    xmlns="http://www.w3.org/2000/svg"
                    style="display: none"
                  >
                    <path
                      d="M38.8 5.1C28.4-3.1 13.3-1.2 5.1 9.2S-1.2 34.7 9.2 42.9l592 464c10.4 8.2 25.5 6.3 33.7-4.1s6.3-25.5-4.1-33.7L525.6 386.7c39.6-40.6 66.4-86.1 79.9-118.4c3.3-7.9 3.3-16.7 0-24.6c-14.8-35.7-46.1-87.7-92.9-131.1C465.5 68.8 400.8 32 320 32c-68.2 0-125 26.3-169.3 60.8L38.8 5.1zM223.1 149.5C248.6 126.2 282.7 112 320 112c79.5 0 144 64.5 144 144c0 24.9-6.3 48.3-17.4 68.7L408 294.5c8.4-19.3 10.6-41.4 4.8-63.3c-11.1-41.5-47.8-69.4-88.6-71.1c-5.8-.2-9.2 6.1-7.4 11.7c2.1 6.4 3.3 13.2 3.3 20.3c0 10.2-2.4 19.8-6.6 28.3l-90.3-70.8zM373 389.9c-16.4 6.5-34.3 10.1-53 10.1c-79.5 0-144-64.5-144-144c0-6.9 .5-13.6 1.4-20.2L83.1 161.5C60.3 191.2 44 220.8 34.5 243.7c-3.3 7.9-3.3 16.7 0 24.6c14.8 35.7 46.1 87.7 92.9 131.1C174.5 443.2 239.2 480 320 480c47.8 0 89.9-12.9 126.2-32.5L373 389.9z"
                    />
                  </svg>
                </button>
              </div>
              <span class="field-error" id="error-password"></span>
            </div>

            <div class="form-options">
              <label class="checkbox-wrap">
                <input type="checkbox" id="ingat-saya" />
                <span class="checkmark"></span>
                Ingat Saya
              </label>
              <a href="/lupa-kata-sandi" class="lupa-pw">Lupa Kata Sandi?</a>
            </div>

            <button type="submit" class="btn-masuk" id="btn-masuk">
              <span id="btn-text">Masuk</span>
              <span id="btn-loader" style="display: none">
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 18 18"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                  class="spin"
                >
                  <path
                    d="M9 1V4M9 14V17M1 9H4M14 9H17M3.05 3.05L5.17 5.17M12.83 12.83L14.95 14.95M3.05 14.95L5.17 12.83M12.83 5.17L14.95 3.05"
                    stroke="white"
                    stroke-width="2"
                    stroke-linecap="round"
                  />
                </svg>
                Memuat...
              </span>
            </button>
          </form>

          <div class="divider"><span>ATAU</span></div>

          <button class="btn-google" id="btn-google">
            <svg
              width="20"
              height="20"
              viewBox="0 0 48 48"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                fill="#FFC107"
                d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12s5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24s8.955,20,20,20s20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"
              />
              <path
                fill="#FF3D00"
                d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"
              />
              <path
                fill="#4CAF50"
                d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"
              />
              <path
                fill="#1976D2"
                d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"
              />
            </svg>
            Masuk dengan Google
          </button>

          <p class="daftar-link">
            Belum punya akun? <a href="/daftar">Daftar sekarang</a>
          </p>
        </div>
      </div>
    </div>

    <!-- ────── Success Modal — Login Berhasil ───── -->
    <div
      class="success-modal-overlay"
      id="success-modal-overlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="success-modal-title"
    >
      <div class="success-modal-card">
        <div class="success-modal-card-brand">LAPAK</div>
        <div class="success-modal-card-icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M5 13l4 4L19 7"
              stroke="#0d5c47"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
        <h2 class="success-modal-card-title" id="success-modal-title">
          Login Berhasil
        </h2>
        <p class="success-modal-card-message" id="success-modal-message">
          Selamat datang kembali di LAPAK. Anda akan diarahkan ke beranda.
        </p>
        <button
          class="success-modal-card-btn"
          type="button"
          id="success-modal-btn"
        >
          Lanjutkan
        </button>
      </div>
    </div>
  </body>
</html>
