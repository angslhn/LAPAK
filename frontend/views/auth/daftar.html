<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LAPAK — Daftar</title>
    <meta
      name="description"
      content="Daftar akun baru di LAPAK — Mulai kelola toko Anda sekarang."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0d5740" />
    <link rel="shortcut icon" href="/public/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="/styles/global.css" />
    <link rel="stylesheet" href="/styles/auth/daftar.css" />
    <script src="/scripts/global.js" defer></script>
    <script src="/scripts/auth/daftar.js" defer></script>
  </head>
  <body>
    <div class="bg">
      <div class="card">
        <h1 class="card-title">Buat Akun Baru</h1>
        <p class="card-subtitle">
          Daftarkan akun untuk mulai mengelola bisnis Anda.
        </p>

        <!-- Alert error -->
        <div class="alert-error" id="alert-error" style="display: none"></div>

        <form class="form" id="form-daftar" novalidate>
          <div class="row-two">
            <div class="field">
              <label class="label" for="nama">Nama Lengkap</label>
              <input
                class="input"
                id="nama"
                name="name"
                type="text"
                placeholder="Masukkan nama lengkap"
                required
              />
              <span class="field-error" id="error-nama"></span>
            </div>
            <div class="field">
              <label class="label" for="toko">Nama Toko</label>
              <input
                class="input"
                id="toko"
                name="store_name"
                type="text"
                placeholder="Masukkan nama toko"
              />
              <span class="field-error" id="error-toko"></span>
            </div>
          </div>

          <div class="field">
            <label class="label" for="email">Email</label>
            <input
              class="input"
              id="email"
              name="email"
              type="email"
              placeholder="contoh@email.com"
              required
            />
            <span class="field-error" id="error-email"></span>
          </div>

          <div class="field">
            <label class="label" for="telepon">Nomor Telepon</label>
            <input
              class="input"
              id="telepon"
              name="phone"
              type="tel"
              placeholder="08xxxxxxxxxx"
            />
            <span class="field-error" id="error-telepon"></span>
          </div>

          <div class="field">
            <label class="label" for="password">Kata Sandi</label>
            <div class="input-wrapper">
              <input
                class="input input--icon"
                id="password"
                name="password"
                type="password"
                placeholder="Minimal 8 karakter"
                required
              />
              <button
                class="eye-btn"
                type="button"
                aria-label="Toggle password"
                data-target="password"
              >
                <!-- Ikon mata terbuka (default) -->
                <svg
                  class="eye-icon eye-show"
                  width="20"
                  height="16"
                  viewBox="0 0 576 512"
                  fill="#9AA0A6"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M288 32c-80.8 0-145.5 36.8-192.6 80.6C48.6 156 17.3 208 2.5 243.7c-3.3 7.9-3.3 16.7 0 24.6C17.3 304 48.6 356 95.4 399.4C142.5 443.2 207.2 480 288 480s145.5-36.8 192.6-80.6c46.8-43.4 78.1-95.4 92.9-131.1c3.3-7.9 3.3-16.7 0-24.6c-14.8-35.7-46.1-87.7-92.9-131.1C433.5 68.8 368.8 32 288 32zM128 256a160 160 0 1 1 320 0 160 160 0 1 1 -320 0zm160-80a80 80 0 1 0 0 160 80 80 0 1 0 0-160z"
                  />
                </svg>
                <!-- Ikon mata tertutup (hidden default) -->
                <svg
                  class="eye-icon eye-hide"
                  width="20"
                  height="16"
                  viewBox="0 0 640 512"
                  fill="#9AA0A6"
                  xmlns="http://www.w3.org/2000/svg"
                  style="display: none"
                >
                  <path
                    d="M38.8 5.1C28.4-3.1 13.3-1.2 5.1 9.2S-1.2 34.7 9.2 42.9l592 464c10.4 8.2 25.5 6.3 33.7-4.1s6.3-25.5-4.1-33.7L525.6 386.7c39.6-40.6 66.4-86.1 79.9-118.4c3.3-7.9 3.3-16.7 0-24.6c-14.8-35.7-46.1-87.7-92.9-131.1C465.5 68.8 400.8 32 320 32c-68.2 0-125 26.3-169.3 60.8L38.8 5.1zM223.1 149.5C248.6 126.2 282.7 112 320 112c79.5 0 144 64.5 144 144c0 24.9-6.3 48.3-17.4 68.7L408 294.5c8.4-19.3 10.6-41.4 4.8-63.3c-11.1-41.5-47.8-69.4-88.6-71.1c-5.8-.2-9.2 6.1-7.4 11.7c2.1 6.4 3.3 13.2 3.3 20.3c0 10.2-2.4 19.8-6.6 28.3l-90.3-70.8zM373 389.9c-16.4 6.5-34.3 10.1-53 10.1c-79.5 0-144-64.5-144-144c0-6.9 .5-13.6 1.4-20.2L83.1 161.5C60.3 191.2 44 220.8 34.5 243.7c-3.3 7.9-3.3 16.7 0 24.6c14.8 35.7 46.1 87.7 92.9 131.1C174.5 443.2 239.2 480 320 480c47.8 0 89.9-12.9 126.2-32.5L373 389.9z"
                  />
                </svg>
              </button>
            </div>
            <span class="field-error" id="error-password"></span>
          </div>

          <div class="field">
            <label class="label" for="konfirmasi">Konfirmasi Kata Sandi</label>
            <div class="input-wrapper">
              <input
                class="input input--icon"
                id="konfirmasi"
                name="confirm_password"
                type="password"
                placeholder="Ulangi kata sandi"
                required
              />
              <button
                class="eye-btn"
                type="button"
                aria-label="Toggle konfirmasi kata sandi"
                data-target="konfirmasi"
              >
                <!-- Ikon mata terbuka (default) -->
                <svg
                  class="eye-icon eye-show"
                  width="20"
                  height="16"
                  viewBox="0 0 576 512"
                  fill="#9AA0A6"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M288 32c-80.8 0-145.5 36.8-192.6 80.6C48.6 156 17.3 208 2.5 243.7c-3.3 7.9-3.3 16.7 0 24.6C17.3 304 48.6 356 95.4 399.4C142.5 443.2 207.2 480 288 480s145.5-36.8 192.6-80.6c46.8-43.4 78.1-95.4 92.9-131.1c3.3-7.9 3.3-16.7 0-24.6c-14.8-35.7-46.1-87.7-92.9-131.1C433.5 68.8 368.8 32 288 32zM128 256a160 160 0 1 1 320 0 160 160 0 1 1 -320 0zm160-80a80 80 0 1 0 0 160 80 80 0 1 0 0-160z"
                  />
                </svg>
                <!-- Ikon mata tertutup (hidden default) -->
                <svg
                  class="eye-icon eye-hide"
                  width="20"
                  height="16"
                  viewBox="0 0 640 512"
                  fill="#9AA0A6"
                  xmlns="http://www.w3.org/2000/svg"
                  style="display: none"
                >
                  <path
                    d="M38.8 5.1C28.4-3.1 13.3-1.2 5.1 9.2S-1.2 34.7 9.2 42.9l592 464c10.4 8.2 25.5 6.3 33.7-4.1s6.3-25.5-4.1-33.7L525.6 386.7c39.6-40.6 66.4-86.1 79.9-118.4c3.3-7.9 3.3-16.7 0-24.6c-14.8-35.7-46.1-87.7-92.9-131.1C465.5 68.8 400.8 32 320 32c-68.2 0-125 26.3-169.3 60.8L38.8 5.1zM223.1 149.5C248.6 126.2 282.7 112 320 112c79.5 0 144 64.5 144 144c0 24.9-6.3 48.3-17.4 68.7L408 294.5c8.4-19.3 10.6-41.4 4.8-63.3c-11.1-41.5-47.8-69.4-88.6-71.1c-5.8-.2-9.2 6.1-7.4 11.7c2.1 6.4 3.3 13.2 3.3 20.3c0 10.2-2.4 19.8-6.6 28.3l-90.3-70.8zM373 389.9c-16.4 6.5-34.3 10.1-53 10.1c-79.5 0-144-64.5-144-144c0-6.9 .5-13.6 1.4-20.2L83.1 161.5C60.3 191.2 44 220.8 34.5 243.7c-3.3 7.9-3.3 16.7 0 24.6c14.8 35.7 46.1 87.7 92.9 131.1C174.5 443.2 239.2 480 320 480c47.8 0 89.9-12.9 126.2-32.5L373 389.9z"
                  />
                </svg>
              </button>
            </div>
            <span class="field-error" id="error-konfirmasi"></span>
          </div>

          <div class="checkbox-row">
            <input class="checkbox" id="syarat" type="checkbox" />
            <label class="checkbox-label" for="syarat"
              >Saya menyetujui syarat dan ketentuan</label
            >
          </div>
          <span class="field-error" id="error-syarat"></span>

          <button class="btn-primary" type="submit" id="btn-daftar">
            <span id="btn-text">Daftar</span>
            <span id="btn-loader" style="display: none">
              <svg
                width="18"
                height="18"
                viewBox="0 0 18 18"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                class="spin"
              >
                <path
                  d="M9 1V4M9 14V17M1 9H4M14 9H17M3.05 3.05L5.17 5.17M12.83 12.83L14.95 14.95M3.05 14.95L5.17 12.83M12.83 5.17L14.95 3.05"
                  stroke="white"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
              Mendaftar...
            </span>
          </button>

          <div class="divider">
            <span class="divider-text">ATAU</span>
          </div>

          <button class="btn-google" type="button" id="btn-google">
            <svg
              class="google-icon"
              width="20"
              height="20"
              viewBox="0 0 48 48"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                fill="#FFC107"
                d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12s5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24s8.955,20,20,20s20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"
              />
              <path
                fill="#FF3D00"
                d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"
              />
              <path
                fill="#4CAF50"
                d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"
              />
              <path
                fill="#1976D2"
                d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"
              />
            </svg>
            Daftar dengan Google
          </button>

          <p class="login-link">
            Sudah punya akun?
            <a class="login-link-anchor" href="/masuk">Masuk</a>
          </p>
        </form>
      </div>
    </div>

    <!-- ──── Toast — Akun Berhasil Dibuat ──── -->
    <div
      class="success-modal-overlay"
      id="success-modal-overlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="success-modal-title"
    >
      <div class="success-modal-card">
        <div class="success-modal-card-brand">LAPAK</div>
        <div class="success-modal-card-icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M5 13l4 4L19 7"
              stroke="#0d5c47"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
        <h2 class="success-modal-card-title" id="success-modal-title">
          Akun Berhasil Dibuat
        </h2>
        <p class="success-modal-card-message">
          Selamat datang di LAPAK. Akun Anda siap digunakan untuk mulai
          mengelola bisnis Anda.
        </p>
        <button
          class="success-modal-card-btn"
          type="button"
          id="success-modal-btn"
        >
          Mulai Sekarang
        </button>
      </div>
    </div>
  </body>
</html>
