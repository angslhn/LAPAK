<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/styles/global.css" />
    <link rel="stylesheet" href="/styles/lupa_kata_sandi.css" />
    <script src="/scripts/lupa_kata_sandi.js" defer></script>
    <title>LAPAK — Lupa Kata Sandi</title>
  </head>
  <body>
    <div class="bg">
      <div class="card">
        <!-- Brand -->
        <div class="brand">
          <span class="brand__name">LAPAK</span>
          <span class="brand__sub">Business Management</span>
        </div>

        <!-- Lapak Logo -->
        <div class="logo">
          <img src="/assets/images/lapak.png" width="65" alt="Lapak Logo" />
        </div>

        <!-- Heading -->
        <h1 class="card__title">Lupa Kata Sandi</h1>
        <p class="card__subtitle">
          Masukkan email akun Anda untuk menerima tautan perubahan kata sandi.
        </p>

        <!-- Alert error -->
        <div class="alert-error" id="alert-error" style="display: none"></div>

        <!-- Alert success -->
        <div class="alert-success" id="alert-success" style="display: none">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
            <polyline points="22 4 12 14.01 9 11.01" />
          </svg>
          <span id="success-message"
            >Email untuk perubahan kata sandi telah dikirim.</span
          >
        </div>

        <!-- Form -->
        <form class="form" id="form-lupa-password" novalidate>
          <div class="field">
            <label class="label" for="email">Email</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="2" y="4" width="20" height="16" rx="2" />
                  <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
                </svg>
              </span>
              <input
                class="input input--padded"
                id="email"
                name="email"
                type="email"
                placeholder="Masukkan email terdaftar"
                autocomplete="email"
                required
              />
            </div>
            <span class="field-error" id="error-email"></span>
          </div>

          <button class="btn-primary" type="submit" id="kirim-btn">
            <span id="btn-text">Kirim Link Perubahan</span>
            <span id="btn-loader" style="display: none">
              <svg
                width="18"
                height="18"
                viewBox="0 0 18 18"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                class="spin"
              >
                <path
                  d="M9 1V4M9 14V17M1 9H4M14 9H17M3.05 3.05L5.17 5.17M12.83 12.83L14.95 14.95M3.05 14.95L5.17 12.83M12.83 5.17L14.95 3.05"
                  stroke="white"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
              Mengirim...
            </span>
          </button>

          <div class="back-link">
            <a href="/masuk" class="back-link__anchor">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M19 12H5" />
                <path d="m12 19-7-7 7-7" />
              </svg>
              Kembali ke Masuk
            </a>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
